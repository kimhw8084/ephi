name: Package integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Package checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package and imported evidence
        run: python tools/check_package.py
      - name: Test checker failure detection
        run: python -m unittest discover -s tests -v
      - name: Check whitespace and unchanged checkout
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  canonical-baseline:
    name: Canonical repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run canonical offline baseline
        run: python tools/w0_repo_baseline.py

  browser-security-integration:
    name: O8.2 browser/session security integration (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ephi_ci
          POSTGRES_PASSWORD: ephi_ci_password
          POSTGRES_DB: ephi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephi_ci -d ephi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install EPHI PostgreSQL and browser qualification dependencies
        run: python -m pip install '.[postgres]' 'playwright==1.62.0'
      - name: Install isolated Chromium for the browser-security lane
        run: python -m playwright install --with-deps chromium
      - name: Run focused O8.2 transport/preflight/middleware-order tests
        run: python -m unittest tests.test_o8_browser_transport -v
      - name: Run direct loopback PostgreSQL and headless browser/session qualification
        run: |
          report="$RUNNER_TEMP/ephi-o8-browser-session-security-direct.json"
          python tools/o8_browser_qualification.py \
            --dsn "$EPHI_TEST_POSTGRES_DSN" \
            --port 8765 \
            --root-path '' \
            --output "$report"
      - name: Run proxy/root-path PostgreSQL and headless browser/session qualification
        run: |
          report="$RUNNER_TEMP/ephi-o8-browser-session-security-proxy.json"
          python tools/o8_browser_qualification.py \
            --dsn "$EPHI_TEST_POSTGRES_DSN" \
            --port 8766 \
            --proxy-port 8767 \
            --proxy \
            --root-path /ephi \
            --output "$report"
      - name: Assert direct and proxy browser qualification evidence
        run: |
          python - "$RUNNER_TEMP/ephi-o8-browser-session-security-direct.json" "$RUNNER_TEMP/ephi-o8-browser-session-security-proxy.json" <<'PY'
          import json
          import sys

          for path, proxy_mode, root_path in ((sys.argv[1], False, ''), (sys.argv[2], True, '/ephi')):
              report = json.load(open(path, encoding='utf-8'))
              assert report['status'] == 'PASS'
              assert report['postgres']['postgres_version'].startswith('18.')
              assert report['execution']['proxy_mode'] is proxy_mode
              assert report['execution']['root_path'] == root_path
              assert report['browser']['attention_page_rendered']
              assert report['browser']['episode_page_rendered']
              assert report['browser']['websocket_session_observed']
              assert not report['browser']['console_errors']
              assert not report['browser']['failed_network_urls']
              assert report['docs_and_fingerprint']['generated_docs_disabled']
              assert report['docs_and_fingerprint']['server_header_absent']
              assert report['disallowed_state_changing_http']['base_security_headers']['required_names_present']
              assert report['disallowed_state_changing_http']['base_security_headers']['server_header_absent']
              assert report['durable_command']['command_receipt_count'] >= 1
              assert report['durable_command']['work_state_present']
              assert report['proxy']['trusted_proxy_count'] == (1 if proxy_mode else 2)
              assert report['proxy']['wildcard_trusted_proxy'] is False
              if proxy_mode:
                  assert report['runtime_route_inventory']['static_resources_loaded_under_root_path']
          print('O8_2_BROWSER_SESSION_SECURITY_PASS')
          PY

  rendered-accessibility-integration:
    name: O10.1 rendered accessibility integration (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ephi_ci
          POSTGRES_PASSWORD: ephi_ci_password
          POSTGRES_DB: ephi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephi_ci -d ephi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install bounded O10 browser lane dependencies
        run: python -m pip install '.[postgres]' 'playwright==1.62.0'
      - name: Install isolated Chromium for O10 rendered qualification
        run: python -m playwright install --with-deps chromium
      - name: Run dependency-light O10 rendered contract tests
        run: python -m unittest tests.test_o10_rendered_accessibility -v
      - name: Run real PostgreSQL/Chromium keyboard and rendered-state qualification
        run: |
          mkdir -p "$RUNNER_TEMP/ephi-o10-rendered"
          python tools/o10_rendered_accessibility.py \
            --dsn "$EPHI_TEST_POSTGRES_DSN" \
            --output "$RUNNER_TEMP/ephi-o10-rendered/report.json" \
            --artifacts "$RUNNER_TEMP/ephi-o10-rendered/screenshots"
      - name: Assert repository-native O10 rendered evidence
        run: |
          python - "$RUNNER_TEMP/ephi-o10-rendered/report.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding='utf-8'))
          from ephi.application.o10 import evaluate_o10_acceptance

          acceptance = evaluate_o10_acceptance(report)
          assert report['status'] == acceptance['status'], acceptance
          assert report['status'] == 'PASS'
          assert acceptance['criteria'], acceptance
          print('O10_1_RENDERED_ACCESSIBILITY_PASS')
          PY
      - name: Upload secret-safe O10 rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: ephi-o10-rendered-accessibility
          path: ${{ runner.temp }}/ephi-o10-rendered
          if-no-files-found: error

  postgresql-integration:
    name: PostgreSQL command/worker/read/artifact/O3/O5/O9 integration (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ephi_ci
          POSTGRES_PASSWORD: ephi_ci_password
          POSTGRES_DB: ephi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephi_ci -d ephi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL optional dependency
        run: python -m pip install 'psycopg[binary]==3.3.6'
      - name: Install PostgreSQL 18 client tools for restore rehearsal
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Apply migration and assert PostgreSQL 18.x
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: |
          python -c "import os; from ephi.infrastructure import PostgreSQLReferenceTransactionAdapter as A; s=A(os.environ['EPHI_TEST_POSTGRES_DSN']); s.apply_migrations(); assert s.server_version().startswith('18.'), s.server_version(); assert type(s).__name__ == 'PostgreSQLReferenceTransactionAdapter'; s.close()"
      - name: Run PostgreSQL logical dump and isolated restore rehearsal
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: |
          rehearsal_root="$(mktemp -d)"
          python tools/o9_real_rehearsal.py \
            --dsn "$EPHI_TEST_POSTGRES_DSN" \
            --admin-dsn "$EPHI_TEST_POSTGRES_DSN" \
            --artifact-root "$rehearsal_root/source-artifacts" \
            --backup-dir "$rehearsal_root/backup" \
            --target-artifact-root "$rehearsal_root/restored-artifacts" \
            --target-database ephi_restore_ci \
            --evidence-dir "$rehearsal_root/evidence" \
            > "$rehearsal_root/summary.json"
          python - "$rehearsal_root/summary.json" <<'PY'
          import json
          import sys

          summary = json.loads(open(sys.argv[1], encoding="utf-8").read())
          assert summary["backup_verification"]["verification_state"] == "VERIFIED"
          assert summary["restore"]["verification_state"] == "VERIFIED"
          assert summary["post_snapshot_reconciliation"]["production_disaster_rpo_rto_claim"] == "NOT_ESTABLISHED"
          assert summary["timing"]["scope"] == "LOCAL_RESTORE_REHEARSAL"
          print("REAL_RESTORE_REHEARSAL_PASS")
          PY
      - name: Run PostgreSQL operations parser and worker-health tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o9_operations -v
      - name: Run PostgreSQL transaction integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o2_postgresql -v
      - name: Run PostgreSQL worker lease integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o2_worker_postgresql -v
      - name: Run PostgreSQL coherent-read and retained-snapshot integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o2_postgresql_reads -v
      - name: Run PostgreSQL immutable-artifact catalog integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o2_postgresql_artifacts -v
      - name: Run PostgreSQL O3 attention and episode integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o3_postgresql -v
      - name: Run PostgreSQL O5 unified Episode workflow integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o5_postgresql -v
      - name: Run PostgreSQL O8 current-authorization security tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o8_postgresql -v
      - name: Run PostgreSQL O4 source ingress integration tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_o4_source_ingress_postgresql -v
      - name: Run PostgreSQL adapter lifecycle regression tests
        env:
          EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
        run: python -m unittest tests.test_postgresql_adapter_lifecycle -v
