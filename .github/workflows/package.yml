  postgresql-integration:
    name: PostgreSQL command/worker/read/artifact/O3/O5/O5.2/O9 integration (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ephi_ci
          POSTGRES_PASSWORD: ephi_ci_password
          POSTGRES_DB: ephi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephi_ci -d ephi_ci"
