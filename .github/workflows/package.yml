    name: O8.2 browser/session security integration (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EPHI_TEST_POSTGRES_DSN: postgresql://ephi_ci:ephi_ci_password@127.0.0.1:5432/ephi_ci
